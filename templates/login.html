<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Warehouse Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
    <div class="min-h-full flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-blue-600 text-white font-bold text-xl mb-4">WI</div>
                <h1 class="text-2xl font-bold text-white">Warehouse Inventory</h1>
                <p class="text-sm text-slate-400 mt-1">Stock &amp; Inventory Tracking Module</p>
            </div>

            <div class="card p-6 sm:p-8">
                <h2 class="text-lg font-semibold text-white mb-1">Sign in to your account</h2>
                <p class="text-sm text-slate-400 mb-6">Enter your credentials to access the dashboard.</p>

                <form id="login-form" class="space-y-4">
                    <div>
                        <label for="username" class="label">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" required
                               class="input" placeholder="e.g. admin">
                    </div>
                    <div>
                        <label for="password" class="label">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required
                               class="input" placeholder="••••••••">
                    </div>

                    <div id="login-error" class="hidden rounded-md border border-red-500/30 bg-red-500/10 text-red-400 text-sm px-3 py-2"></div>

                    <button type="submit" id="login-submit" class="btn btn-primary w-full justify-center">
                        Sign In
                    </button>
                </form>
            </div>

            <div class="card mt-4 p-4 sm:p-5">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Demo Accounts</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <button type="button" class="demo-account-btn" data-username="admin" data-password="123456">
                        <span class="font-semibold text-white">Admin</span>
                        <span class="text-slate-400">admin / 123456</span>
                    </button>
                    <button type="button" class="demo-account-btn" data-username="manager" data-password="123456">
                        <span class="font-semibold text-white">Manager</span>
                        <span class="text-slate-400">manager / 123456</span>
                    </button>
                    <button type="button" class="demo-account-btn" data-username="store" data-password="123456">
                        <span class="font-semibold text-white">Storekeeper</span>
                        <span class="text-slate-400">store / 123456</span>
                    </button>
                    <button type="button" class="demo-account-btn" data-username="viewer" data-password="123456">
                        <span class="font-semibold text-white">Viewer</span>
                        <span class="text-slate-400">viewer / 123456</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-full max-w-sm px-4 sm:px-0"></div>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
